<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premier Ink & Imagination</title>
    <meta name="description" content="Digital school library portal for Premier International School learners and staff, featuring catalog discovery, circulation management, and reading resources." />
    <meta property="og:title" content="Premier Ink & Imagination" />
    <meta property="og:description" content="Digital school library portal for Premier International School learners and staff, featuring catalog discovery, circulation management, and reading resources." />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PremierLib" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      // Gracefully prevent third-party browser extension errors (e.g., MetaMask, wallet inpage scripts) from crashing or triggering false error banners
      window.addEventListener('error', function(event) {
        var filename = event.filename || '';
        var message = event.message || '';
        if (
          filename.indexOf('chrome-extension://') !== -1 ||
          filename.indexOf('moz-extension://') !== -1 ||
          filename.indexOf('safari-extension://') !== -1 ||
          message.indexOf('MetaMask') !== -1 ||
          message.indexOf('metamask') !== -1 ||
          message.indexOf('ethereum') !== -1 ||
          message.indexOf('Failed to connect to MetaMask') !== -1
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var message = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (
          message.indexOf('MetaMask') !== -1 ||
          message.indexOf('metamask') !== -1 ||
          message.indexOf('ethereum') !== -1 ||
          message.indexOf('chrome-extension://') !== -1 ||
          message.indexOf('moz-extension://') !== -1 ||
          message.indexOf('Failed to connect to MetaMask') !== -1
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
